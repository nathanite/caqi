<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cali AQI Sensor detail</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />

    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", stored || (prefersDark ? "dark" : "light"));
  })();
</script>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

    </svg>
    <span class="brand-mark">Cali AQI</span>
  </div>
  <nav>
    <a href="/">&larr; map</a>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">🌙</button>
  </nav>
</div>

<div class="detail-wrap">
  <a class="back-link" href="/">&larr; back to map</a>
 
  <div class="detail-header">
    <h1 class="owner" id="owner-label">Loading…</h1>
    <div class="sub" id="updated-sub"></div>
  </div>
 
  <div class="now-row" id="now-row"></div>

  <div class="panel" id="summary-panel" style="display:none;">
    <h2>Weekly summary</h2>
    <p id="summary-text" class="summary-text"></p>
    <div class="summary-meta" id="summary-meta"></div>
  </div>
 
  <div class="range-row">
    <label for="range-select">Time range</label>
    <select id="range-select" onchange="loadChartData(this.value)">
      <option value="24h">Last 24 Hours</option>
      <option value="week" selected>Last 7 Days</option>
      <option value="month">Last 30 Days</option>
    </select>
  </div>
 
  <div class="panel">
    <h2 id="aqi-panel-title">Air quality</h2>
    <canvas id="aqiChart"></canvas>
  </div>
 
  <div class="panel">
    <h2 id="pm-panel-title">PM2.5 / PM10</h2>
    <canvas id="pmChart"></canvas>
  </div>
 
  <div class="panel">
    <h2 id="temp-panel-title">Temperature</h2>
    <canvas id="tempChart"></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="config.js"></script>
<script src="aqi-helpers.js"></script>
<script>
const params = new URLSearchParams(location.search);
const sensorId = params.get("id");

async function supaGet(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    },
  });
  if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
  return res.json();
}

async function supaGetAll(path, pageSize = 1000) {
  let all = [];
  let from = 0;
  const separator = path.includes("?") ? "&" : "?";
  while (true) {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/${path}${separator}limit=${pageSize}&offset=${from}`,
      {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        },
      }
    );
    if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
    const rows = await res.json();
    all = all.concat(rows);
    if (rows.length < pageSize) break;
    from += pageSize;
  }
  return all;
}
function aggregateDaily(rows) {
  const byDay = {};
  rows.forEach((r) => {
    const d = new Date(r.created_at);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    (byDay[key] = byDay[key] || []).push(r);
  });
  return Object.keys(byDay).sort().map((key) => ({
    created_at: new Date(`${key}T12:00:00`).toISOString(), // noon, for chart placement
    aqi: medianOf(byDay[key].map((r) => r.aqi)),
    temperature: medianOf(byDay[key].map((r) => r.temperature)),
    pm25: medianOf(byDay[key].map((r) => r.pm25)),
    pm10: medianOf(byDay[key].map((r) => r.pm10)),
  }));
}
 
function renderNowRow(latest, trendWindow) {
  const cat = aqiCategory(latest.aqi);
 
  const aqiTrend = trendVsYesterday(trendWindow, "aqi", latest.aqi);
  const tempTrend = trendVsYesterday(trendWindow, "temperature", latest.temperature);
 
  const aqiTrendHtml = aqiTrend ? trendHtml(aqiTrend.delta, "", "bad-up", 3) : "";
  const tempTrendHtml = tempTrend ? trendHtml(tempTrend.delta, "°F", "neutral", 1) : "";
 
  document.getElementById("now-row").innerHTML = `
    <div class="now-card aqi">
      <div class="label">AQI</div>
      <div class="value"><span class="swatch" style="background:${resolveCssVar(cat.bg)}"></span>${latest.aqi} · ${cat.name}</div>
      ${aqiTrendHtml}
    </div>
    <div class="now-card">
      <div class="label">Temp</div>
      <div class="value">${latest.temperature.toFixed(1)}°F</div>
      ${tempTrendHtml}
    </div>
    <div class="now-card">
      <div class="label">PM2.5</div>
      <div class="value">${latest.pm25.toFixed(1)}</div>
    </div>
    <div class="now-card">
      <div class="label">PM10</div>
      <div class="value">${latest.pm10.toFixed(1)}</div>
    </div>`;
}
 
function buildChart(ctx, datasets, yLabel, timeUnit) {
  return new Chart(ctx, {
    type: "line",
    data: { datasets },
    options: {
      responsive: true,
      interaction: { mode: "index", intersect: false },
      scales: {
        x: {
          type: "time",
          time: { unit: timeUnit },
          grid: { color: "#e4e8e4" },
        },
        y: {
          title: { display: true, text: yLabel },
          grid: { color: "#e4e8e4" },
        },
      },
      plugins: { legend: { position: "bottom" } },
    },
  });
}
 
let aqiChartInstance = null;
let tempChartInstance = null;
let pmChartInstance = null;
 
const RANGE_CONFIG = {
  "24h":  { days: 1,  label: "last 24 hours",              aggregate: false, timeUnit: "hour" },
  week:   { days: 7,  label: "last 7 days",                 aggregate: false, timeUnit: "day" },
  month:  { days: 30, label: "last 30 days", aggregate: false,  timeUnit: "day" },
};
 
async function loadChartData(range) {
  const cfg = RANGE_CONFIG[range];
  document.getElementById("aqi-panel-title").textContent = `Air quality — ${cfg.label}`;
  document.getElementById("pm-panel-title").textContent = `PM2.5 / PM10 — ${cfg.label}`;
  document.getElementById("temp-panel-title").textContent = `Temperature — ${cfg.label}`;
 
  let rows;
  try {
    rows = await supaGetAll(
      `readings?sensor_id=eq.${encodeURIComponent(sensorId)}` +
      `&created_at=gte.${encodeURIComponent(new Date(Date.now() - cfg.days * 24 * 3600 * 1000).toISOString())}` +
      `&order=created_at.asc&select=aqi,temperature,pm25,pm10,created_at`
    );
  } catch (err) {
    console.error(err);
    return;
  }
 
  const points = cfg.aggregate ? aggregateDaily(rows) : rows;
 
  if (aqiChartInstance) aqiChartInstance.destroy();
  if (tempChartInstance) tempChartInstance.destroy();
  if (pmChartInstance) pmChartInstance.destroy();
 
  const aqiCanvasHost = document.getElementById("aqiChart") || restoreCanvas("aqiChart");
  const pmCanvasHost = document.getElementById("pmChart") || restoreCanvas("pmChart");
  const tempCanvasHost = document.getElementById("tempChart") || restoreCanvas("tempChart");
 
  if (!points.length) {
    aqiCanvasHost.outerHTML = `<div class="empty-state" id="aqiChart-empty">No readings in the ${cfg.label} yet.</div>`;
    pmCanvasHost.outerHTML = `<div class="empty-state" id="pmChart-empty">No readings in the ${cfg.label} yet.</div>`;
    tempCanvasHost.outerHTML = `<div class="empty-state" id="tempChart-empty">No readings in the ${cfg.label} yet.</div>`;
    return;
  }
 
  const toXY = (key) => points.map((r) => ({ x: r.created_at, y: r[key] }));
 
  aqiChartInstance = buildChart(document.getElementById("aqiChart"), [
    { label: "AQI", data: toXY("aqi"), borderColor: "#2f5db3", backgroundColor: "transparent", tension: 0.25, pointRadius: cfg.aggregate ? 2 : 0 },
  ], "AQI", cfg.timeUnit);
 
  pmChartInstance = buildChart(document.getElementById("pmChart"), [
    { label: "PM2.5 (µg/m³)", data: toXY("pm25"), borderColor: "#059669", backgroundColor: "transparent", tension: 0.25, pointRadius: cfg.aggregate ? 2 : 0 },
    { label: "PM10 (µg/m³)", data: toXY("pm10"), borderColor: "#ff7e00", backgroundColor: "transparent", tension: 0.25, pointRadius: cfg.aggregate ? 2 : 0 },
  ], "µg/m³", cfg.timeUnit);
 
  tempChartInstance = buildChart(document.getElementById("tempChart"), [
    { label: "Temperature (°F)", data: toXY("temperature"), borderColor: "#7e0023", backgroundColor: "transparent", tension: 0.25, pointRadius: cfg.aggregate ? 2 : 0 },
  ], "°F", cfg.timeUnit);
}
function restoreCanvas(id) {
  const old = document.getElementById(`${id}-empty`);
  const canvas = document.createElement("canvas");
  canvas.id = id;
  old.replaceWith(canvas);
  return canvas;
}

async function loadSummary() {
  try {
    const rows = await supaGet(`sensor_summaries?sensor_id=eq.${encodeURIComponent(sensorId)}&select=*`);
    if (!rows.length) return; 
    const row = rows[0];
    document.getElementById("summary-text").textContent = row.summary;
    document.getElementById("summary-meta").textContent =
      `Generated ${fmtTime(row.generated_at)} · updated every few hours, not on every visit`;
    document.getElementById("summary-panel").style.display = "";
  } catch (err) {
    console.error("Failed to load summary:", err);
  }
}
  
async function init() {
  if (!sensorId) {
    document.getElementById("owner-label").textContent = "No sensor selected";
    return;
  }
 
  try {
    const [sensors, latestRows, trendWindow] = await Promise.all([
      supaGet(`sensors?id=eq.${encodeURIComponent(sensorId)}&select=owner_label`),
      supaGet(`latest_readings?sensor_id=eq.${encodeURIComponent(sensorId)}&select=*`),
      supaGet(
        `readings?sensor_id=eq.${encodeURIComponent(sensorId)}` +
        `&created_at=gte.${encodeURIComponent(new Date(Date.now() - 26 * 3600 * 1000).toISOString())}` +
        `&order=created_at.asc&select=aqi,temperature,created_at`
      ),
    ]);
 
    const ownerLabel = sensors[0]?.owner_label || "Unknown sensor";
    document.title = ownerLabel;
    document.getElementById("owner-label").textContent = ownerLabel;
 
    if (latestRows[0]) {
      renderNowRow(latestRows[0], trendWindow);
      document.getElementById("updated-sub").textContent =
        `updated ${fmtTime(latestRows[0].created_at)} · ${minutesAgo(latestRows[0].created_at)} min ago`;
    }
 
    await loadChartData(document.getElementById("range-select").value);
  } catch (err) {
    console.error(err);
    document.getElementById("owner-label").textContent = "Couldn't load sensor data";
  }
}
 
init();
</script>
</body>
</html>
